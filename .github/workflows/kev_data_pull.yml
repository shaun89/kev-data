# .github/workflows/kev-sync.yml
name: Sync KEV data (minimal)

on:
  # 4 PM Eastern:
  #  - Mar–Oct ≈ 20:00 UTC
  #  - Nov–Feb ≈ 21:00 UTC
  schedule:
    - cron: "0 20 * 3-10 *"
    - cron: "0 21 * 11,12,1,2 *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch KEV CSV & JSON (overwrite)
        shell: bash
        run: |
          set -euo pipefail
          set -x
          CSV_URL="https://www.cisa.gov/sites/default/files/csv/known_exploited_vulnerabilities.csv"
          JSON_URL="https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
          curl -fSLo known_exploited_vulnerabilities.csv  "$CSV_URL"
          curl -fSLo known_exploited_vulnerabilities.json "$JSON_URL"
          ls -l known_exploited_vulnerabilities.*

      - name: Commit if changed
        shell: bash
        run: |
          set -euo pipefail
          set -x
          git config user.name  "kev-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add known_exploited_vulnerabilities.csv known_exploited_vulnerabilities.json || true
          git status --porcelain=v1
          git diff --cached --stat || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync KEV data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
            echo "Changes committed & pushed."
          else
            echo "No changes detected."
          fi
