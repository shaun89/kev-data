# .github/workflows/kev-sync.yml
name: Sync KEV data

on:
  # 4 PM Eastern:
  #  - Mar–Oct ≈ 20:00 UTC
  #  - Nov–Feb ≈ 21:00 UTC
  schedule:
    - cron: "0 20 * 3-10 *"
    - cron: "0 21 * 11,12,1,2 *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kev-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Fetch, validate, compare, and replace
        shell: bash
        run: |
          set -euo pipefail
          CSV_URL="https://www.cisa.gov/sites/default/files/csv/known_exploited_vulnerabilities.csv"
          JSON_URL="https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
          CSV_OUT="known_exploited_vulnerabilities.csv"
          JSON_OUT="known_exploited_vulnerabilities.json"

          # Download fresh copies with retries
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$CSV_OUT.tmp"  "$CSV_URL"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$JSON_OUT.tmp" "$JSON_URL"

          # Validate CSV
          head -n 1 "$CSV_OUT.tmp" | grep -qiE 'cve|vulnerability|date|vendor|product' || {
            echo "CSV header sanity check failed"; exit 1; }
          # Validate JSON
          jq . < "$JSON_OUT.tmp" >/dev/null

          # Hashes
          old_csv="$( [ -f "$CSV_OUT" ]  && sha256sum "$CSV_OUT"  | awk '{print $1}' || echo 'NONE' )"
          old_json="$( [ -f "$JSON_OUT" ] && sha256sum "$JSON_OUT" | awk '{print $1}' || echo 'NONE' )"
          new_csv="$(sha256sum "$CSV_OUT.tmp"  | awk '{print $1}')"
          new_json="$(sha256sum "$JSON_OUT.tmp" | awk '{print $1}')"

          echo "CSV  old:$old_csv  new:$new_csv"
          echo "JSON old:$old_json new:$new_json"
