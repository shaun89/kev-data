# .github/workflows/kev-sync.yml
name: Sync KEV data

on:
  # 4 PM Eastern year-round:
  #  - Mar–Oct (DST): 20:00 UTC
  #  - Nov–Feb:       21:00 UTC
  schedule:
    - cron: "0 20 * 3-10 *"
    - cron: "0 21 * 11,12,1,2 *"
  workflow_dispatch: {}

permissions:
  contents: write   # allow commits/pushes via GITHUB_TOKEN

concurrency:
  group: kev-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure jq
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Fetch & validate → replace atomically (with logs)
        shell: bash
        run: |
          set -euo pipefail
          set -x

          CSV_URL="https://www.cisa.gov/sites/default/files/csv/known_exploited_vulnerabilities.csv"
          JSON_URL="https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
          UA="kev-sync/1.0 (+github actions)"
          CSV_OUT="known_exploited_vulnerabilities.csv"
          JSON_OUT="known_exploited_vulnerabilities.json"

          # Show current repo state for debugging
          ls -l || true

          # HEAD requests for visibility
          curl -I -H "User-Agent: $UA" "$CSV_URL"  || true
          curl -I -H "User-Agent: $UA" "$JSON_URL" || true

          # Download to temp with retries + conditional GET
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
               -H "User-Agent: $UA" \
               -z "$CSV_OUT" -o "$CSV_OUT.tmp" "$CSV_URL" || exit 1

          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
               -H "User-Agent: $UA" \
               -z "$JSON_OUT" -o "$JSON_OUT.tmp" "$JSON_URL" || exit 1

          # If 304 (Not Modified), temp can be empty—clean it up
          [ -s "$CSV_OUT.tmp" ]  || rm -f "$CSV_OUT.tmp"
          [ -s "$JSON_OUT.tmp" ] || rm -f "$JSON_OUT.tmp"

          # Validate + swap in place
          if [ -f "$CSV_OUT.tmp" ]; then
            head -n 1 "$CSV_OUT.tmp" | grep -qiE 'cve|vulnerability|date|vendor|product' \
              || { echo "CSV header sanity check failed"; exit 1; }
            mv -f "$CSV_OUT.tmp" "$CSV_OUT"
          fi

          if [ -f "$JSON_OUT.tmp" ]; then
            jq . < "$JSON_OUT.tmp" >/dev/null
            mv -f "$JSON_OUT.tmp" "$JSON_OUT"
          fi

          # Show final sizes for visibility
          ls -l "$CSV_OUT" "$JSON_OUT" || true

      - name: Commit if data changed
        run: |
          set -euo pipefail
          git config user.name  "kev-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add known_exploited_vulnerabilities.csv known_exploited_vulnerabilities.json || true

          if ! git diff --cached --quiet; then
            git commit -m "chore: sync KEV data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
            echo "Changes committed & pushed."
          else
            echo "No changes detected."
          fi
